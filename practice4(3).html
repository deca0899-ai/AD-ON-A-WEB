<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>VACATIONS</title>
    <style>
        * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #f5f1e8 0%, #e8dcc8 100%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

form {
  background: linear-gradient(180deg, #fdfbf7 0%, #f9f5ed 100%);
  border-radius: 20px;
  padding: 50px 40px;
  max-width: 500px;
  width: 100%;
  box-shadow: 0 20px 60px rgba(139, 119, 101, 0.15);
  border: 2px solid rgba(216, 191, 165, 0.3);
}

form::before {
  content: '✦';
  display: block;
  text-align: center;
  font-size: 32px;
  color: #c9a876;
  margin-bottom: 30px;
  letter-spacing: 10px;
}

h1 {
  text-align: center;
  color: #7a6b5d;
  font-size: 28px;
  margin-bottom: 10px;
  font-weight: 600;
}

.form-subtitle {
  text-align: center;
  color: #a89968;
  font-size: 13px;
  margin-bottom: 30px;
  letter-spacing: 1px;
}

div {
  margin-bottom: 25px;
}

label {
  display: block;
  color: #8b7765;
  font-size: 14px;
  font-weight: 500;
  margin-bottom: 10px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

input[type="number"],
input[type="text"],
select {
  width: 100%;
  padding: 14px 16px;
  border: 2px solid #e0d5c7;
  border-radius: 10px;
  font-size: 15px;
  color: #6b5d52;
  background-color: #fefdfb;
  transition: all 0.3s ease;
  font-family: inherit;
}

input[type="number"]:focus,
input[type="text"]:focus,
select:focus {
  outline: none;
  border-color: #d4a574;
  background-color: #fffbf5;
  box-shadow: 0 0 0 3px rgba(212, 165, 116, 0.1);
}

input::placeholder {
  color: #c9b8a8;
}

select {
  appearance: none;
  background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238b7765' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
  background-repeat: no-repeat;
  background-position: right 12px center;
  background-size: 20px;
  padding-right: 40px;
}

option {
  color: #6b5d52;
  background-color: #fefdfb;
  padding: 10px;
}

input[type="checkbox"] {
  width: 20px;
  height: 20px;
  margin-right: 12px;
  cursor: pointer;
  accent-color: #d4a574;
  vertical-align: middle;
}

input[type="checkbox"] + label {
  display: inline;
  margin: 0;
  font-size: 14px;
  text-transform: none;
}

p {
  color: #a89968;
  font-size: 13px;
  line-height: 1.8;
  text-align: center;
  background: linear-gradient(135deg, rgba(212, 165, 116, 0.08) 0%, rgba(196, 166, 120, 0.08) 100%);
  padding: 20px;
  border-radius: 10px;
  border-left: 4px solid #d4a574;
}

button {
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, #d4a574 0%, #c9985f 100%);
  color: #ffffff;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  text-transform: uppercase;
  letter-spacing: 1px;
  box-shadow: 0 8px 20px rgba(212, 165, 116, 0.3);
}

button:hover {
  background: linear-gradient(135deg, #c9985f 0%, #b88a4a 100%);
  box-shadow: 0 12px 28px rgba(212, 165, 116, 0.4);
  transform: translateY(-2px);
}

button:active {
  transform: translateY(0);
  box-shadow: 0 6px 16px rgba(212, 165, 116, 0.3);
}

/* Holy places themed decoration */
form::after {
  content: '🕉️ ☪️ ✝️';
  display: block;
  text-align: center;
  font-size: 20px;
  color: #a89968;
  margin-top: 25px;
  letter-spacing: 15px;
  opacity: 0.6;
}

    </style>
</head>
