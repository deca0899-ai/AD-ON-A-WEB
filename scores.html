<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Tak</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

table {
    width: 100%;
    max-width: 500px;
    border-collapse: collapse;
    background: white;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    border-radius: 10px;
    overflow: hidden;
}

thead {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
}

th {
    padding: 18px;
    text-align: left;
    font-size: 16px;
    font-weight: 600;
    color: white;
    letter-spacing: 0.5px;
}

td {
    padding: 16px 18px;
    font-size: 15px;
    color: #333;
    border-bottom: 1px solid #e0e0e0;
}

tbody tr {
    transition: background-color 0.3s ease;
}

tbody tr:hover {
    background-color: #f5f5f5;
}

tbody tr:last-child td {
    border-bottom: none;
}

tbody tr:nth-child(even) {
    background-color: #fafafa;
}

    </style>
</head>
<body>
    <h1>Runs scored</h1>
    <table>
        <thead>
            <tr>
                <th>Player-11</th>
                <th>Runs Scored</th>


            </tr>


            <tbody>
                <tr>
                    <td>Aman</td>
                    <td>12</td>
                </tr>
                <tr>
                    <td>shyam</td>
                    <td>23</td>
                </tr>
                <tr>
                    <td>lal</td>
                    <td>19</td>
                </tr>


            </tbody>
        </thead>
    </table>
</body>
</html>
