<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table in html</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 40px 20px;
}

h1 {
    text-align: center;
    color: white;
    margin-bottom: 40px;
    font-size: 2.5em;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
}

table {
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
    border-collapse: collapse;
    background: white;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    border-radius: 8px;
    overflow: hidden;
}

thead {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
}

th {
    padding: 18px 20px;
    text-align: left;
    font-weight: 600;
    color: white;
    font-size: 1.1em;
    letter-spacing: 0.5px;
}

tbody tr {
    border-bottom: 1px solid #e0e0e0;
    transition: background-color 0.3s ease;
}

tbody tr:hover {
    background-color: #f5f5f5;
}

tbody tr:last-child {
    border-bottom: none;
}

tbody th {
    padding: 16px 20px;
    text-align: left;
    font-weight: 500;
    color: #333;
    background-color: transparent;
}

tbody tr:nth-child(odd) {
    background-color: #fafafa;
}

tbody tr:nth-child(even) {
    background-color: white;
}

@media (max-width: 600px) {
    h1 {
        font-size: 1.8em;
    }

    table {
        font-size: 0.9em;
    }

    th {
        padding: 12px 10px;
    }

    tbody th {
        padding: 10px 10px;
    }
}

    </style>
</head>
<body>
    <h1>TABLES</h1>
    <table>
        <thead>
            <tr>
                <th>Team</th>
                <th>Rank</th>
                <th>No of players</th>

            </tr>


            <tbody>
                <tr>
                    <th>boult</th>
                    <th>conqurer</th>
                    <th>4</th>
                </tr>
                <tr>
                    <th>nexus</th>
                    <th>gold</th>
                    <th>2</th>
                </tr>
                <tr>
                    <th>yash</th>
                    <th>ace</th>
                    <th>3</th>
                </tr>

            </tbody>
        </thead>
    </table>
    
</body>
</html>
