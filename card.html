<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOOGLE ADS</title>
    <style>
        .card_design {
            max-width: 470px;
            margin: 0 auto;
            /* Bina flexbox ke center karne ki trick */
            background-color: grey;
            border: 3px solid #0F172A;
            padding: 25px;


            box-shadow: 10px 10px 0px #0F172A;

        }

        .inside_box {
            max-width: 290px;
            margin: 0 auto;
            background-color: linen;
            border: 3px solid #0F172A;
            border-radius: 12px;
            padding: 25px;

        }

        .headings {
            display: inline-block;
            background-color: red;
            color: #FFFFFF;
            padding: 12px;
            border-radius: 8px;
            margin: 5px;


        }

        h1 {
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            color: yellowgreen;
            box-shadow: -7px 3px 5px 3px #c7d112;
        }

        .end_head {
            display: inline-block;
            background-color: skyblue;
            color: black;
            border-radius: 12px;
            margin-top: 10px;
            margin-bottom: 8px;
            padding: 7px;
            margin-left: 150px;
        }
    </style>
</head>

<body>
    <div class="card_design">
        <div class="inside_box">
            <img src="img.png.jpg" width="295">

            <div>
                <span class="headings">Durga Puja</span>
                <span class="headings">Family</span>

            </div>
            <h1>
                FESTIVALS OF JOY
            </h1>

            <br>
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Laborum soluta incidunt nostrum! Libero
            reprehenderit facere ad laborum ipsum nulla ipsa veritatis cumque, alias eius expedita, nostrum a. Quod,
            autem incidunt!



            <br>
            <footer>
                <div>
                    <span><a href="https://en.wikipedia.org/wiki/Durga_Puja" target="_blank"   class="end_head">Read
                            More</a></span>
                </div>
            </footer>



        </div>
    </div>


</body>

</html>
